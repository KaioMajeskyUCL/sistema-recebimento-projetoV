
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container cadastro-container">
        <h1>Cadastro de Usuário</h1>
        <p>Preencha os dados para criar sua conta.</p>

        <form id="formCadastro">
            <label for="nome">Nome</label>
            <input type="text" id="nome" required maxlength="100">

            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" required minlength="6">

            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" required minlength="6">

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagemCadastro" role="status"></p>

        <p>
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>
    </main>

    <script src="cadastro.js"></script>
</body>
</html>
