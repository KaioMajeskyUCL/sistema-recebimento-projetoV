
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gestão de Recebimento de Cargas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            padding: 35px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7dd3fc;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensagem {
            text-align: center;
            color: #f87171;
            margin-top: 18px;
        }
    </style>
</head>

<body>
    <main class="login-container">
        <h1>Recebimento de Cargas</h1>
        <p class="subtitulo">Acesso ao sistema</p>

        <form id="formLogin">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                required
                autocomplete="username"
                placeholder="Digite seu e-mail"
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                required
                autocomplete="current-password"
                placeholder="Digite sua senha"
            >

            <button type="submit" id="btnEntrar">
                Entrar
            </button>
        </form>

        <p class="link-cadastro">
    Ainda não possui uma conta?
    <a href="cadastro.html">Cadastre-se aqui</a>
</p>

        <p id="mensagem" role="alert"></p>
    </main>

    <script src="login.js"></script>
</body>
</html>
